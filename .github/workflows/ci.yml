name: Access Console CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Build Next.js
        env:
          CASDOOR_ISSUER: "http://127.0.0.1:8000"
          CASDOOR_CLIENT_ID: "ci-only-client"
          CASDOOR_CLIENT_SECRET: "ci-only-client-secret"
          CASDOOR_GOOGLE_PROVIDER: "provider_oauth_google"
          CASDOOR_GITHUB_PROVIDER: "provider_oauth_github"
        run: |
          export AUTH_SECRET="$(openssl rand -base64 32)"
          npm run build

  backend:
    name: Backend Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: access_console
          POSTGRES_DB: access_console
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U access_console -d access_console"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__AccessConsole: "Host=127.0.0.1;Port=5432;Database=access_console;Username=access_console;Password=ci-only-password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/AccessConsole.Api/AccessConsole.Api.csproj

      - name: Check code formatting
        run: dotnet format backend/AccessConsole.Api/AccessConsole.Api.csproj --verify-no-changes --no-restore

      - name: Build ASP.NET Core
        run: dotnet build backend/AccessConsole.Api/AccessConsole.Api.csproj --no-restore --configuration Release

      - name: Install EF Core tools
        run: dotnet tool install dotnet-ef --tool-path ./.tools --version 10.0.14

      - name: Apply database migrations
        run: >-
          ./.tools/dotnet-ef database update
          --project backend/AccessConsole.Api/AccessConsole.Api.csproj
          --startup-project backend/AccessConsole.Api/AccessConsole.Api.csproj
          --context AccessConsoleDbContext

      - name: Test authentication and API health
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -euo pipefail

          BASE="http://127.0.0.1:5080"

          dotnet run \
            --project backend/AccessConsole.Api/AccessConsole.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            -- --urls "$BASE" > api.log 2>&1 &

          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          SIAP=0
          for nomor in {1..30}; do
            if curl -fsS "$BASE/health/ready" > /dev/null; then
              SIAP=1
              break
            fi
            sleep 1
          done

          if [ "$SIAP" -ne 1 ]; then
            cat api.log
            exit 1
          fi

          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health/ready")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/accounts/me")" = "401"

          REG_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -d '{"email":"ci.user@example.com","displayName":"CI User","kataSandi":"Testing123!"}' \
            "$BASE/api/auth/register")

          test "$REG_STATUS" = "201"

          LOGIN_JSON=$(curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"email":"ci.user@example.com","kataSandi":"Testing123!"}' \
            "$BASE/api/auth/login")

          ACCESS_TOKEN=$(printf '%s' "$LOGIN_JSON" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["accessToken"])')

          test -n "$ACCESS_TOKEN"

          STATUS_AKUN=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/api/accounts/me")

          test "$STATUS_AKUN" = "200"

          STATUS_LOGOUT=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/api/auth/logout")

          test "$STATUS_LOGOUT" = "204"

          STATUS_TOKEN_LAMA=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/api/accounts/me")

          test "$STATUS_TOKEN_LAMA" = "401"

          echo "API health, registration, login, and logout tests passed"

      - name: Verify connected provider status and ownership
        run: python3 scripts/test-connected-providers.py

      - name: Verify production Casdoor endpoint protection
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Production
          CASDOOR_ISSUER: https://casdoor.example.invalid
          CASDOOR_CLIENT_ID: ci-only-client
        run: |
          set -euo pipefail

          BASE="http://127.0.0.1:5081"
          CERT_DIR=$(mktemp -d)
          export DataProtection__CertificatePassword="$(openssl rand -hex 32)"

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=Access Console CI" \
            -keyout "$CERT_DIR/key.pem" -out "$CERT_DIR/cert.pem"
          openssl pkcs12 -export -inkey "$CERT_DIR/key.pem" \
            -in "$CERT_DIR/cert.pem" -out "$CERT_DIR/cert.pfx" \
            -passout env:DataProtection__CertificatePassword
          export DataProtection__CertificateBase64="$(base64 -w 0 "$CERT_DIR/cert.pfx")"

          dotnet run \
            --project backend/AccessConsole.Api/AccessConsole.Api.csproj \
            --configuration Release --no-build --no-launch-profile \
            -- --urls "$BASE" > api-production.log 2>&1 &

          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; rm -f "$CERT_DIR/key.pem" "$CERT_DIR/cert.pem" "$CERT_DIR/cert.pfx"; rmdir "$CERT_DIR"' EXIT

          for nomor in {1..30}; do
            if curl -fsS "$BASE/health/ready" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "$BASE/health/ready" > /dev/null

          for endpoint in verify exchange link; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              -d '{"kataSandi":null}' "$BASE/api/auth/casdoor/$endpoint")
            test "$STATUS" = "401"
          done

          echo "Production Casdoor endpoints require authentication"

  casdoor:
    name: Casdoor Container Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casdoor
          POSTGRES_DB: casdoor
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casdoor -d casdoor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Casdoor container
        run: docker build -f deployment/casdoor/Dockerfile.vercel -t access-console-casdoor:ci deployment/casdoor

      - name: Verify startup, OIDC discovery and shared sessions
        shell: bash
        run: |
          set -euo pipefail

          CERT_DIR=$(mktemp -d)
          COOKIE_JAR=$(mktemp)
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          trap 'docker rm -f casdoor-ci redis-ci >/dev/null 2>&1 || true; rm -f "$CERT_DIR/cert.pem" "$CERT_DIR/key.pem" "$COOKIE_JAR"; rmdir "$CERT_DIR"' EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' \
            -keyout "$CERT_DIR/key.pem" -out "$CERT_DIR/cert.pem"
          chmod 755 "$CERT_DIR"
          chmod 644 "$CERT_DIR/key.pem" "$CERT_DIR/cert.pem"

          docker run -d --name redis-ci --network host \
            -v "$CERT_DIR:/certs:ro" redis:7-alpine redis-server \
            --port 0 --tls-port 6379 --tls-cert-file /certs/cert.pem \
            --tls-key-file /certs/key.pem --tls-ca-cert-file /certs/cert.pem \
            --tls-auth-clients no --requirepass ci-only-redis-password

          start_casdoor() {
            docker run -d --name casdoor-ci --network host \
              -v "$CERT_DIR/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro" \
              -e PORT=8000 \
              -e 'dataSourceName=host=127.0.0.1 port=5432 user=casdoor password=ci-only-password dbname=casdoor sslmode=disable' \
              -e origin=https://casdoor.example.invalid \
              -e "initAdminPassword=$ADMIN_PASSWORD" \
              -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
              -e REDIS_PASSWORD=ci-only-redis-password \
              access-console-casdoor:ci

            for nomor in {1..90}; do
              if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            if ! curl -fsS http://localhost:8000/api/health >/dev/null; then
              docker logs casdoor-ci
              return 1
            fi
          }

          start_casdoor
          curl -fsS http://localhost:8000/.well-known/openid-configuration | python3 -c \
            'import json,sys; assert json.load(sys.stdin)["issuer"] == "https://casdoor.example.invalid"'

          curl -fsS -c "$COOKIE_JAR" -H 'Content-Type: application/json' \
            -d "{\"organization\":\"built-in\",\"application\":\"app-built-in\",\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\",\"type\":\"login\",\"signinMethod\":\"Password\"}" \
            http://localhost:8000/api/login | python3 -c \
            'import json,sys; r=json.load(sys.stdin); assert r["status"] == "ok", r.get("msg")'

          check_account() {
            curl -fsS -b "$COOKIE_JAR" http://localhost:8000/api/get-account | python3 -c \
              'import json,sys; r=json.load(sys.stdin); assert r["status"] == "ok" and r["name"] == "admin", r.get("msg")'
          }

          check_account
          docker rm -f casdoor-ci
          start_casdoor
          check_account
          echo "Casdoor PostgreSQL startup, Redis TLS and admin session after container replacement passed"
