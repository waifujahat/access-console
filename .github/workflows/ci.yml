name: Access Console CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  backend:
    name: Backend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/AccessConsole.Api/AccessConsole.Api.csproj

      - name: Check code formatting
        run: dotnet format backend/AccessConsole.Api/AccessConsole.Api.csproj --verify-no-changes --no-restore

      - name: Build ASP.NET Core
        run: dotnet build backend/AccessConsole.Api/AccessConsole.Api.csproj --no-restore --configuration Release
