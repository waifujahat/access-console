services:
  - type: web
    name: access-console-casdoor
    runtime: image
    plan: free
    image:
      url: docker.io/casbin/casdoor:v4.27.1
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: httpport
        value: "8000"
      - key: runmode
        value: prod
      - key: driverName
        value: postgres
      - key: dbName
        value: casdoor
      - key: dataSourceName
        sync: false
      - key: origin
        sync: false
      - key: originFrontend
        sync: false
      - key: initAdminPassword
        sync: false
      - key: isDemoMode
        value: "false"
      - key: showSql
        value: "false"
      - key: enableErrorMask
        value: "true"
      - key: disableUpgrade
        value: "true"
